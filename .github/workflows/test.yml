name: Tests

# 回帰テスト（依存なしの Node スクリプト）を PR と main への push で実行する。
# deploy.yml とは独立したワークフローで、失敗してもデプロイは止めない（検知のみ）。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # 内部リンク網・FAQ可視化・sitemap・基本タグ・生成物のドリフト
      - name: On-page checks
        run: node scripts/test-onpage.js

      # DRL値の原典照合・プロトコール名マッピング・DRL表の生成物のドリフト
      - name: DRL mapping checks
        run: node scripts/test-drl-mapping.js

      # 造影CTシミュレータの薬物動態モデル（生食後押し・ピークの位置・物質収支・文献範囲）
      - name: Contrast simulator model checks
        run: node scripts/test-contrast-simulator.js

      # 散乱線シミュレータの計算（照合表との一致・NCRP 147 の計算例・物理的にありえない値・実効線量への換算）
      - name: Scatter simulator model checks
        run: node scripts/test-scatter-simulator.js

      # CT線量推定ツールの SSDE 換算係数（AAPM Report 204 Table 1D / Report 293 Eq.1 との一致）
      - name: CT dose estimator SSDE factor checks
        run: node scripts/test-ct-dose.js

      # 胸部X線写真の匠の採点（EUR 16260 との照合表・満点に届く・1項目だけ崩すとその項目だけ減点）
      - name: Chest X-ray game scoring checks
        run: node scripts/test-chest-xray.js

      - name: Generated blocks are up to date
        run: |
          node scripts/generate-related.js --check
          node scripts/generate-faq.js --check
          node scripts/generate-drl-table.js --check
