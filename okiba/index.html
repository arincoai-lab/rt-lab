<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 通信先を自分自身に限定する（写真・場所のデータを外部へ送る経路を作らない）。インラインのスクリプト・スタイルも使わない -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>おきばメモ</title>
<meta name="description" content="ものの置き場所を写真つきで記録して、すぐに探せるスマホ用アプリ。データは端末の中だけに保存し、外部には送信しません。">
<meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1a19" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おきば">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="style.css">
<script src="core.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="topbar">
  <button type="button" class="icon-btn back" data-act="back" aria-label="戻る" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <h1 id="title">おきばメモ</h1>
</header>

<div id="banner" class="banner" hidden></div>

<main id="view" tabindex="-1">
  <p class="loading">読み込み中…</p>
</main>

<nav class="tabbar" aria-label="メインメニュー">
  <a href="#/" data-tab="home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <span>さがす</span>
  </a>
  <a href="#/places" data-tab="places">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10l8-6 8 6v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M9.5 20v-5.5h5V20"/></svg>
    <span>場所</span>
  </a>
  <a href="#/new" data-tab="new" class="tab-add">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span>置いた</span>
  </a>
  <a href="#/data" data-tab="data">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19h14"/></svg>
    <span>データ</span>
  </a>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<dialog id="picker" class="sheet" aria-labelledby="picker-title">
  <div class="sheet-head">
    <h2 id="picker-title">場所を選ぶ</h2>
    <button type="button" class="icon-btn" data-pick="close" aria-label="閉じる">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <nav class="crumbs" id="picker-crumbs" aria-label="現在の階層"></nav>
  <ul class="list" id="picker-list"></ul>
  <form class="inline-add" id="picker-add">
    <input type="text" name="name" maxlength="100" placeholder="ここに新しい場所を追加（例: 引き出し上段）" enterkeyhint="done" autocomplete="off">
    <button type="submit" class="btn">追加</button>
  </form>
  <div class="sheet-foot">
    <button type="button" class="btn primary block" data-pick="choose" id="picker-choose">ここに決定</button>
  </div>
</dialog>

<dialog id="lightbox" class="lightbox" aria-label="写真の拡大表示">
  <img id="lightbox-img" alt="">
</dialog>

<noscript><p class="noscript">このアプリを使うには JavaScript を有効にしてください。</p></noscript>
</body>
</html>
